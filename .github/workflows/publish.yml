name: publish to PyPI

# Push a tag vX.Y.Z to release (normally done by .githooks/pre-push when main
# is pushed; see docs/releasing.md). The version comes from that tag via
# setuptools-scm. Uses PyPI trusted publishing: no token is stored; PyPI lists
# this repository, this workflow file (publish.yml) and the environment "pypi"
# as the trusted publisher - don't rename either.
on:
  push:
    tags: ["v*.*.*"]

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # setuptools-scm needs the tags
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Built version must equal the tag
        run: |
          want="${GITHUB_REF_NAME#v}"
          ls dist/
          test -f "dist/hklforge-${want}.tar.gz" || { echo "sdist is not version $want (dirty tree or tag not on this commit?)"; exit 1; }
      - name: sdist must contain the package data and the license
        run: |
          tar -tzf dist/hklforge-*.tar.gz > files.txt
          for f in LICENSE src/hklforge/crystal/spacegroups.json src/hklforge/geometries/psic.yml; do
            grep -q "/$f\$" files.txt || { echo "missing in sdist: $f"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hklforge
    permissions:
      id-token: write       # for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
