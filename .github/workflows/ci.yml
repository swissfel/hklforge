name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:          # reused by publish.yml before a release

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install with the reference implementations the tests compare against
        run: python -m pip install ".[test]"
      - name: Run tests
        # test_double.py needs bernina-scripts and is skipped here
        run: python -m pytest -q
