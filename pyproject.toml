[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "hklforge"
dynamic = ["version"]
description = "Diffractometer angle solvers generated exactly from a declared geometry, with crystallography for planning"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{name = "Henrik Lemke"}]
readme = "README.md"
keywords = ["diffraction", "diffractometer", "crystallography", "x-ray", "hkl", "synchrotron", "XFEL"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",
    "Development Status :: 3 - Alpha",
]
# floors = the oldest versions the test suite was run against (Python 3.10)
dependencies = ["numpy>=1.24", "pyyaml>=6.0"]

[project.urls]
Homepage = "https://github.com/swissfel/hklforge"
Documentation = "https://github.com/swissfel/hklforge/tree/main/docs"

[project.optional-dependencies]
draw = ["matplotlib"]
# hklforge.crystal: reflection tables (pandas), form factors and anomalous terms (xraydb)
crystal = ["pandas", "xraydb"]
# reference implementations the tests compare against
test = ["pytest", "scipy", "diffcalc-core", "xrayutilities", "matplotlib", "pandas", "xraydb", "gemmi"]
examples = ["matplotlib", "pandas", "jupyter", "diffcalc-core", "xrayutilities"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"hklforge.geometries" = ["*.yml"]
"hklforge.crystal" = ["spacegroups.json"]

[tool.setuptools_scm]
# the version comes from the git tag: v0.1.0 -> 0.1.0 (see docs/releasing.md)

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
